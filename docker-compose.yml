# Full stack: Postgres, Redis, the API, a Celery worker, Celery Beat, and the
# Next.js frontend.
#
#   cp backend/.env.example backend/.env      # then set SECRET_KEY
#   docker compose up --build
#
#   API      http://localhost:8000/api/
#   Docs     http://localhost:8000/api/docs/
#   Frontend http://localhost:3000
#
# For day-to-day development prefer docker-compose.dev.yml (Postgres + Redis
# only) and run Django and Next on the host, where reloads are faster.

x-django-env: &django-env
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in a .env file next to this compose file}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  # `db` and `redis` are the compose service names. localhost inside a
  # container is the container itself, not the host.
  DATABASE_URL: postgres://tracker:tracker@db:5432/tracker
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-TaskLane <no-reply@tasklane.local>}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./backend
    environment:
      <<: *django-env
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    # depends_on alone only waits for the container to start, not for Postgres
    # to accept connections. service_healthy waits for the healthcheck.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      <<: *django-env
      # Only `web` migrates; three containers racing the same migration is a
      # deadlock waiting to happen.
      RUN_MIGRATIONS: "0"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  beat:
    build:
      context: ./backend
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined at build time. The browser resolves this, so it must be an
        # address the browser can reach -- not the compose service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  media_data:
