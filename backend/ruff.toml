line-length = 100
target-version = "py313"

exclude = [".venv", "migrations", "staticfiles", "media"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # DRF and Django idioms call functions in defaults
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
"config/settings.py" = ["F405", "E402"]
